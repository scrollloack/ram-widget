[package]
name = "ram-widget"
version = "0.1.1"
edition = "2024"

[dependencies]
auto-launch = "0.6.0"
slint = { version = "1.19.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software"] }
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }
tray-icon = { version = "0.26.1", default-features = false }

[build-dependencies]
slint-build = "1.19.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }

[profile.release]
strip = true
